[project]
name = "magnet-pinn"
version = "0.0.13alpha5"
description = "This is the software package for simulating EM Fields using NNs"
authors = [
    { name = "Andrzej Dulny", email = "andzej.dulny@gmail.com" },
    { name = "Anna Krause", email = "krause@informatik.uni-wuerzburg.de" },
    { name = "Farzad Jabbarigargari", email = "Jabbarigar_F@ukw.de" },
    { name = "Alex Tarasov", email = "tarasov.oleksander@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.4",
    "trimesh>=4.2.4",
    "h5py>=3.10.0,<4.0.0",
    "torch>=2.3.1,<3.0.0",
    "rtree>=1.2.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "tqdm>=4.66.4,<5.0.0",
    "einops>=0.8.0,<0.9.0",
    "libigl>=2.6.1,<3.0.0",
    "findiff>=0.10.2,<0.11.0",
    "natsort>=8.4.0,<9.0.0",
    "ordered-set>=4.1.0,<5.0.0",
    "manifold3d>=3.1.0,<4.0.0",
    "pytorch3dunet>=1.9.6",
]

[project.optional-dependencies]
linters = [
    "pre-commit>=3.7.0,<4.0.0",
    "black>=24.4.0,<25.0.0",
    "mypy>=1.9.0,<2.0.0",
    "pylint",
    "flake8>=7.0.0,<8.0.0",
    "isort>=5.13.2,<6.0.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.8.4,<4.0.0",
    "jupyterlab>=4.1.5,<5.0.0",
    "ipywidgets>=8.1.2,<9.0.0",
    "sphinx>=7.2.6,<8.0.0",
    "jupyterlab-widgets>=3.0.10,<4.0.0",
    "black>=24.4.0,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "flake8>=7.0.0,<8.0.0",
    "pre-commit-hooks>=4.6.0,<5.0.0",
    "pre-commit>=3.7.0,<4.0.0",
    "pip-tools>=7.4.1,<8.0.0",
    "numpydoc>=1.7.0,<2.0.0",
    "sphinx-conestack-theme>=1.0b3,<2.0.0",
    "sphinx-rtd-theme>=2.0.0,<3.0.0",
    "sphinx-design>=0.5.0,<0.6.0",
    "pytest>=8.3.2,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "coverage>=7.6.3,<8.0.0",
    "flake8-pyproject>=1.2.4",
    "pytest-xdist>=3.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.pytest.ini_options]
addopts = [
    # Allow test files to have the same name in different directories.
    "--import-mode=importlib",
]

[tool.coverage.run]
source = [
    "magnet_pinn",
    "magnet_pinn/models/_unet3d",
]
omit = [
    "tests/*",
    "*__init__.py",
]

[tool.coverage.report]
skip_empty = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
